# Add-on for a host that also runs JeMPI (Docker Swarm stack, overlay network `frontend`).
# Start JeMPI first, then: docker compose -f docker-compose.yml -f docker-compose.jempi.yml up -d
# identity-mediator reaches JeMPI through haproxy (jempi_haproxy:50000), which routes /JeMPI to the API; the API itself is on `backend` only.
services:
  identity-mediator:
    networks:
      - openhim
      - jempi

networks:
  jempi:
    name: frontend
    external: true
