name: openhim

networks:
  openhim:

volumes:
  mongo-data:
  hapi-db-data:
  hapi-lucene-data:
  caddy-data:
  caddy-config:

services:
  caddy:
    container_name: caddy
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["vps"]
    networks:
      - openhim
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      # `vps-ip` may be the active profile instead. Caddyfile itself needs a
      # non-empty DOMAIN when this domain profile is started.
      DOMAIN: "${DOMAIN:-}"
    depends_on:
      - openhim-core
      - keycloak
      - openhim-console

  caddy-ip:
    container_name: caddy-ip
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["vps-ip"]
    networks:
      - openhim
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile.ip:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      # `vps` may be the active profile instead. Caddyfile.ip needs a non-empty
      # VPS_IP when this raw-IP profile is started.
      VPS_IP: "${VPS_IP:-}"
    depends_on:
      - keycloak

  hapi-db:
    container_name: hapi-db
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - openhim
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "${HAPI_DB_PASSWORD:?set in .env}"
      # Read by hapi-db/init/10-roles.sh to create the keycloak and identity roles.
      KEYCLOAK_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD:?set in .env}"
      IDENTITY_DB_PASSWORD: "${IDENTITY_DB_PASSWORD:?set in .env}"
    volumes:
      - hapi-db-data:/var/lib/postgresql/data
      - ./hapi-db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d hapi || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
  mongo-db:
    container_name: mongo-db
    image: mongo:4.0
    networks:
      - openhim
    volumes:
      - "mongo-data:/data/db"
    restart: unless-stopped

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.7.2
    restart: unless-stopped
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://hapi-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD:?set in .env}"
      # TLS ends at Caddy; the container port is bound to loopback only.
      KC_HTTP_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?set in .env}"
      KC_HOSTNAME: "${KEYCLOAK_PUBLIC_URL:-http://localhost:8083}"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_FEATURES: dpop
    ports:
      - "127.0.0.1:8083:8080"
    networks:
      - openhim
    depends_on:
      hapi-db:
        condition: service_healthy
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  openhim-core:
    container_name: openhim-core
    image: ghcr.io/etech-nepal/openhim-core:master
    restart: unless-stopped
    environment:
      TZ: Asia/Kathmandu
      mongo_url: "mongodb://mongo-db/openhim-development"
      mongo_atnaUrl: "mongodb://mongo-db/openhim-development"
      # Loads openhim-config/production.json (mounted below): bundled self-signed
      # cert instead of the default Let's Encrypt path, and client Basic auth off
      # so every client must use a DPoP-bound JWT. Booleans cannot be turned off
      # through env vars ("false" is a non-empty string), hence the file.
      NODE_ENV: "production"
      api_sessionKey: "${OPENHIM_SESSION_KEY:?set in .env}"
      # basic stays for onboard-client.sh; the API listens on loopback only.
      api_authenticationTypes: '["local","basic","token"]'

      authentication_enableJWTAuthentication: "true"
      authentication_jwt_algorithms: "RS256"
      authentication_jwt_issuer: "${KEYCLOAK_ISSUER:-http://localhost:8083/realms/openhie}"
      authentication_jwt_audience: "account"
      # Keys fetched live from the realm (and cached), so a key rotation or an external
      # Keycloak needs no PEM file. Must be reachable from inside the container.
      authentication_jwt_jwksUri: "${KEYCLOAK_JWKS_URI:-http://keycloak:8080/realms/openhie/protocol/openid-connect/certs}"
      # DPoP (RFC 9449): a token carrying cnf.jkt must come with a proof whose htu is
      # <this><path>. Must be the URL clients call. Empty turns the DPoP check off.
      authentication_jwt_dpopPublicBaseUrl: "${PUBLIC_BASE_URL:-https://localhost:5000}"
    ports:
      - "127.0.0.1:8080:8080" # OpenHIM Core API (Caddy, Console and mediators reach it on the Docker network)
      - "5000:5000" # Secure transaction port (HTTPS)
      - "127.0.0.1:5001:5001" # Non-secure transaction port (HTTP; local only)
    networks:
      - openhim
    volumes:
      - ./openhim-config/production.json:/app/config/production.json:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('https').get('https://127.0.0.1:8080/heartbeat', {rejectUnauthorized: false}, r => { r.resume(); process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"
      interval: 30s
      timeout: 30s
      retries: 3
    depends_on:
      mongo-db:
        condition: service_started

  openhim-console:
    container_name: openhim-console
    image: ghcr.io/etech-nepal/openhim-console:master
    restart: unless-stopped
    networks:
      - openhim
    ports:
      - "127.0.0.1:9000:80"
    healthcheck:
      test: "curl -sS http://openhim-console || exit 1"
      interval: 30s
      timeout: 30s
      retries: 3
    depends_on:
      - openhim-core

  fhir:
    container_name: fhir
    # Stock HAPI 8.12 plus the platform's access rules (openhie/hapi-interceptors).
    image: ghcr.io/etech-nepal/openhie-hapi:${OPENHIE_IMAGE_TAG:?set in .env}
    restart: unless-stopped
    networks:
      - openhim
    depends_on:
      hapi-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_PASSWORD: "${HAPI_DB_PASSWORD:?set in .env}"
      # Every request needs a token from this realm; the token's SMART scopes and
      # client decide what it may do. See openhie/hapi-interceptors/README.md.
      NP_AUTH_ISSUER: "${KEYCLOAK_ISSUER:-http://localhost:8083/realms/openhie}"
      NP_AUTH_JWKS_URI: "${KEYCLOAK_JWKS_URI:-http://keycloak:8080/realms/openhie/protocol/openid-connect/certs}"
      NP_IDENTITY_CLIENT_ID: identity-mediator
      # May find a Patient by phone (the patient portal's OTP login); nobody else can.
      NP_PHONE_LOOKUP_CLIENT_IDS: patient-portal-mediator
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./hapi-config/application.yaml:/app/config/application.yaml:ro
      - ./hapi-config/np.core-1.0.0.tgz:/app/config/np.core-1.0.0.tgz:ro
      # Full-text index HAPI needs to expand NP Core's address ValueSets (see application.yaml).
      - hapi-lucene-data:/home/nonroot
    # No healthcheck: the image is distroless (no shell, no curl, no javac), so any
    # in-container probe always fails. Check from the host: curl http://localhost:8081/fhir/metadata

  # Every Patient write: JeMPI, the Health ID register, HAPI. Also duplicate review
  # and merge for the admin portal.
  identity-mediator:
    container_name: identity-mediator
    image: ghcr.io/etech-nepal/openhie-identity-mediator:${OPENHIE_IMAGE_TAG:?set in .env}
    restart: unless-stopped
    networks:
      - openhim
    env_file:
      - ./env/identity-mediator.env
    # JeMPI runs as its own stack. When it is on this same host, set
    # JEMPI_BASE_URL=http://host.docker.internal:50000/JeMPI in env/identity-mediator.env.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      IDENTITY_DB_PASSWORD: "${IDENTITY_DB_PASSWORD:?set in .env}"
      KEYCLOAK_ISSUER: "${KEYCLOAK_ISSUER:-http://localhost:8083/realms/openhie}"
    volumes:
      # The same link config JeMPI uses, for duplicate scoring.
      - ./jempi-config:/config:ro
      # Its own Keycloak client key (scripts/onboard-client.sh identity-mediator ...).
      - ./keys/identity-mediator.key.pem:/run/secrets/identity-mediator.key.pem:ro
    depends_on:
      hapi-db:
        condition: service_healthy
      openhim-core:
        condition: service_healthy
      fhir:
        condition: service_started

  # Non-FHIR input (CDRS rows) and FHIR Bundles that carry Patients.
  transform-mediator:
    container_name: transform-mediator
    image: ghcr.io/etech-nepal/fhir-transform-mediator:${OPENHIE_IMAGE_TAG:?set in .env}
    restart: unless-stopped
    # The in-container NP Core validator loads terminology from tx.fhir.org at start.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - openhim
    env_file:
      - ./env/transform-mediator.env
    environment:
      KEYCLOAK_ISSUER: "${KEYCLOAK_ISSUER:-http://localhost:8083/realms/openhie}"
    volumes:
      # Apps, channels and mappings. Edit, then recreate this service; no image rebuild.
      - ./mediator-config/transform:/app/config:ro
      - ./hapi-config/np.core-1.0.0.tgz:/config/np.core-1.0.0.tgz:ro
    depends_on:
      openhim-core:
        condition: service_healthy
      identity-mediator:
        condition: service_started

  patient-portal-mediator:
    container_name: patient-portal-mediator
    image: ghcr.io/etech-nepal/openhie-patient-portal-mediator:${OPENHIE_IMAGE_TAG:?set in .env}
    restart: unless-stopped
    networks:
      - openhim
    env_file:
      - ./env/patient-portal-mediator.env
    environment:
      KEYCLOAK_ISSUER: "${KEYCLOAK_ISSUER:-http://localhost:8083/realms/openhie}"
    volumes:
      # Its own read-only Keycloak client key, for HAPI (scripts/onboard-client.sh
      # patient-portal-mediator ... patient-portal-mediator).
      - ./keys/patient-portal-mediator.key.pem:/run/secrets/patient-portal-mediator.key.pem:ro
    depends_on:
      openhim-core:
        condition: service_healthy
      fhir:
        condition: service_started
